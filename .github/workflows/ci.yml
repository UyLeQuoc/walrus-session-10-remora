name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here touches the network beyond package installs, and nothing touches mainnet.
# Tests that read a real Walrus Memory account skip themselves when credentials are absent.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run lint

      - name: Docs links resolve, and the README's Tatum call list is current
        run: |
          bun scripts/check-links.ts
          bun scripts/tatum-calls.ts --check

      - name: Typecheck
        run: bun run typecheck

      # Includes the packages/schema contract fixture test.
      - name: Test
        run: bun run test

      - name: Build the web app
        run: bun run build

      - name: Audit dependencies
        run: bun pm scan

      - name: Secrets and reference clones must not be committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vq '\.env\.example$'; then
            echo "::error::an .env file is tracked"; exit 1
          fi
          if git ls-files | grep -Eq '^(reference|memwal)/'; then
            echo "::error::a read-only reference clone is tracked"; exit 1
          fi
          if git ls-files | grep -Eq '(^|/)\.turbo/'; then
            echo "::error::turbo cache is tracked"; exit 1
          fi
          echo "clean"

  move:
    runs-on: ubuntu-latest
    env:
      # Pinned: allowances need >= 1.81 (sui::allowance isn't in 1.74's framework). See docs/spikes.
      SUI_VERSION: testnet-v1.82.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI
        if: hashFiles('packages/move/remora/Move.toml') != ''
        run: |
          mkdir -p /tmp/sui-cli "$HOME/.local/bin"
          curl -fsSL "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz" | tar -xz -C /tmp/sui-cli
          install -m 0755 "$(find /tmp/sui-cli -type f -name sui | head -1)" "$HOME/.local/bin/sui"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: sui move test
        run: |
          if [ ! -f packages/move/remora/Move.toml ]; then
            echo "packages/move/remora has no Move package yet; skipping."
            exit 0
          fi
          sui --version
          (cd packages/move/remora && sui move test)
          (cd packages/move/hatchery && sui move test)
          (cd packages/move/receipts && sui move test)
          (cd packages/move/kitty && sui move test)
