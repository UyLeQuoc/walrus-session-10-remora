<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remora — always-on agents with a leash on chain</title>
    <meta
      name="description"
      content="Remoras are always-on agents with memory you own on Walrus, spending limits enforced on Sui (the Disc), and a receipt (Wake) for every action."
    />
    <meta name="robots" content="noindex" />
    <meta name="application-name" content="Remora" />
    <meta name="apple-mobile-web-app-title" content="Remora" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Remora" />
    <meta property="og:title" content="Remora — always-on agents with a leash on chain" />
    <meta
      property="og:description"
      content="Owned memory on Walrus, onchain spending limits on Sui, and a receipt for every action."
    />
    <!--
      Decide the theme before the first paint. React sets the same class, but it
      does so after mount, which is long enough for a dark-mode reader to get a
      white flash. Wrapped because storage throws in a private window.
    -->
    <script>
      try {
        const saved = localStorage.getItem("remora.theme");
        const dark =
          saved === "dark" ||
          (saved === null && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
