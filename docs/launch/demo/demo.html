<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remora demo</title>
<meta name="viewport" content="width=1920">
<!--
  ADR-0091, ADR-0093 and ADR-0096: the demo video, in the app's dark theme. The real app on Sui testnet, recorded by
  e2e/tests/demo.spec.ts, played 1:1 in a window and told the way WalForm's videos are:
  - a hook;
  - without vs with;
  - chapters with a step tracker on top, a caption track at the bottom and a spotlight on the element
    in question;
  - a diagram of where the money goes, the attack, why Remora, a lockup.

  Drawn in the app's own design system (openbot tokens). Every frame is a pure function of time:
  `render(t)` resolves once the footage frame is decoded. render.ts renders 60 fps with motion blur.
  Footage times come from the capture's own marks, so a re-capture needs no re-timing.
-->
<script src="capture/index.js"></script>
<style>
  :root {
    /* ADR-0096: the app's dark theme (openbot `.dark`), to match the footage. */
    --canvas: #0d0d0d; --frame: #1a1a1a; --sheet: #1a1a1a; --inset: #212121; --border: rgba(255,255,255,.06);
    --border2: rgba(255,255,255,.1); --ink: #ffffff; --ink2: #dcdcdc; --muted: #979797; --dim: #6a6a6a;
    --accent: #007cf7; --accent-soft: rgba(0,124,247,.16); --accent-text: #42a0ff;
    --ok: #31cf76; --ok-soft: rgba(49,207,118,.12); --ok-text: #31cf76;
    --warn: #ff9412; --warn-soft: rgba(255,148,18,.12);
    --bad: #fd2f3b; --bad-soft: rgba(253,47,59,.16); --bad-text: #ff6069;
    --inverse: #f0f0f0; --brand: #8379ff; --line: rgba(255,255,255,.14);

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; display: none; }
  .mono { font-family: var(--mono); }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }

  .chip { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--border2); font-size: 19px; color: var(--ink2); white-space: nowrap; }

  /* The window around the footage, 1:1. */
  #win { position: absolute; left: 240px; top: 104px; width: 1440px; height: 936px; border-radius: 18px; overflow: hidden; display: none; transform-origin: 50% 0;
         background: var(--frame); border: 1px solid var(--border2); box-shadow: 0 50px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04); }
  #chrome { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--border); }
  #chrome i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  #url { margin-left: 18px; width: 520px; height: 24px; border-radius: 7px; background: rgba(255,255,255,.06); border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13px; color: var(--muted); }
  #view { position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--canvas); }
  #cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }

  #ov { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; overflow: visible; }
  #badge { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(36,36,36,.94); border: 1px solid rgba(255,255,255,.14); color: #fff; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; opacity: 0; white-space: nowrap; z-index: 5; }
  /* Step tracker, top centre. */
  #steps { position: absolute; left: 0; right: 0; top: 40px; display: flex; justify-content: center; opacity: 0; }
  #steps .box { display: flex; align-items: center; padding: 6px 8px; background: var(--sheet); border: 1px solid var(--border2); border-radius: 14px; box-shadow: 0 14px 34px rgba(0,0,0,.4); }
  #steps .ch { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 16px 0 10px; border-right: 1px solid var(--border2); margin-right: 8px; white-space: nowrap; }
  #steps .it { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 10px; }
  #steps .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 14px; font-weight: 650; }
  #steps .lb { font-size: 17px; font-weight: 620; white-space: nowrap; }
  #steps .ln { width: 44px; height: 2px; background: var(--line); position: relative; margin: 0 2px; }
  #steps .ln i { position: absolute; left: 0; top: 0; height: 2px; width: 100%; background: var(--accent); transform-origin: left; }
  /* Captions, bottom centre. */
  .cap { position: absolute; left: 960px; bottom: 58px; max-width: 1300px; padding: 14px 24px; border-radius: 14px; background: rgba(36,36,36,.94); color: #fff; border: 1px solid rgba(255,255,255,.12);
         font-size: 26px; font-weight: 500; letter-spacing: -.01em; line-height: 1.35; text-align: center; box-shadow: 0 18px 44px rgba(0,0,0,.5); display: none; white-space: nowrap; }
  .cap b { color: #8ec5ff; font-weight: 650; }
  .icon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; }
</style>

<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080" class="abs" style="left:0;top:0"></canvas>
  <div id="scenes"></div>
  <div id="win">

<script>
"use strict";
// ───────────────────────────── engine ─────────────────────────────
const FPS = 60;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  out: (x) => 1 - (1 - x) ** 3, out5: (x) => 1 - (1 - x) ** 5, in: (x) => x * x * x,
  inOut: (x) => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  back: (x) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; },
  site: (x) => 1 - (1 - x) ** 4,
};
const P = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
const $ = (id) => document.getElementById(id);
function css(el, o) {
  if (typeof el === "string") el = $(el);
  if (!el) return;
  const tr = [];
  if (o.x !== undefined || o.y !== undefined) tr.push(`translate(${o.x || 0}px, ${o.y || 0}px)`);
  if (o.s !== undefined) tr.push(`scale(${o.s})`);
  if (o.r !== undefined) tr.push(`rotate(${o.r}deg)`);
  if (tr.length) el.style.transform = tr.join(" ");
  if (o.o !== undefined) el.style.opacity = o.o;
  if (o.blur !== undefined) el.style.filter = o.blur > 0.05 ? `blur(${o.blur}px)` : "none";
  if (o.text !== undefined && el.textContent !== o.text) el.textContent = o.text;
}
const rise = (el, t, a, d = .6, dist = 24) => { const k = P(t, a, a + d, E.out5); css(el, { o: k, y: (1 - k) * dist, blur: (1 - k) * 6 }); return k; };
/** A headline whose rows rise out of a mask, character by character. */
function headline(rows, cls, style) {
  return `<div class="h ${cls}" style="${style}">${rows.map((r) => `<div class="row" style="${r.style || ""}">${[...r.t].map((c) => `<span>${c === " " ? "&nbsp;" : c}</span>`).join("")}</div>`).join("")}</div>`;
}
function headAnim(id, t, t0, t1 = 1e9) {
  const el = $(id); if (!el) return;
  [...el.querySelectorAll(".row")].forEach((row, k) => {
    [...row.children].forEach((c, i) => {
      const p = P(t, t0 + k * .1 + i * .014, t0 + k * .1 + i * .014 + .6, E.site);
      const q = P(t, t1 + k * .04 + i * .005, t1 + k * .04 + i * .005 + .3, E.in);
      c.style.transform = `translateY(${(1 - p) * 110 - q * 110}%)`;
    });
  });
}
const LOGO = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><title>Remora</title><rect width="100" height="100" rx="24" fill="#6054ec"/><svg x="20" y="20" width="60" height="60" viewBox="276 96 348 348"><path fill="#fff" d="M330 120H360V420H330A30 30 0 0 1 300 390V150A30 30 0 0 1 330 120ZM360 120H510A30 30 0 0 1 540 150V180H360ZM540 180H570A30 30 0 0 1 600 210V270A30 30 0 0 1 570 300H540ZM360 240H540V300H360ZM480 300H540V360H510A30 30 0 0 1 480 330ZM540 360H600V390A30 30 0 0 1 570 420H540Z"/></svg></svg>`;
$("hud-l").innerHTML = `${LOGO(18)}<span>Remora · demo</span>`;
const IC = {
  wallet: '<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v4h-4a2 2 0 0 0 0 4h4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/>',
  key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.7 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1Z"/>',
  receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/>',
  brain: '<path d="M12 5a3 3 0 1 0-6 .1 4 4 0 0 0-2.5 5.8 4 4 0 0 0 .6 6.6A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 6 .1 4 4 0 0 1 2.5 5.8 4 4 0 0 1-.6 6.6A4 4 0 1 1 12 18Z"/><path d="M12 5v13"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  disc: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',
  server: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01"/><path d="M7 16.5h.01"/>',
  store: '<path d="M3 9 5 4h14l2 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  fish: '<path d="M6.5 12c.9-3.6 4.2-6 8-6 3.5 0 6 3 7.5 6-1.5 3-4 6-7.5 6-3.8 0-7.1-2.4-8-6Z"/><path d="M6.5 12 2 8v8Z"/><path d="M17 12h.01"/>',
  layers: '<path d="m12 2 9 5-9 5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/>',
};
const icon = (k, c = "currentColor", s = 24, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><title>${k}</title>${IC[k]}</svg>`;

// ───────────────────────────── footage ─────────────────────────────
const CAP = window.CAPTURE || {};
function mark(shot, label) {
  const m = CAP[shot]; if (!m) return 0;
  if (label === "start") return 0; if (label === "end") return m.duration / 1000;
  const e = m.events.find((x) => x.label === label);
  if (!e) console.warn(`no mark "${label}" in ${shot}`);
  return e ? e.t / 1000 : 0;
}
function clip(shot, segs) {
  let out = 0;
  const S = segs.map((s) => {
    const a = mark(shot, s.from) + (s.fromOff || 0), b = mark(shot, s.to) + (s.toOff || 0);
    const dur = s.dur ?? Math.max(.01, (b - a) / (s.speed || 1));
    const r = { a, b, o0: out, o1: out + dur, badge: s.badge }; out += dur; return r;
  });
  return { shot, segs: S, dur: out };
}
function srcAt(c, lt) {
  for (const s of c.segs) if (lt < s.o1 || s === c.segs.at(-1)) { const k = clamp((lt - s.o0) / (s.o1 - s.o0)); return { ts: lerp(s.a, s.b, k), seg: s }; }
  return { ts: 0, seg: c.segs[0] };
}
/** Where an element was, as the capture recorded it (ADR-0096): the last box with that label. */
function boxOf(shot, label) {
  const b = (CAP[shot]?.events || []).filter((e) => e.type === "box" && e.label === label).at(-1);
  if (!b) { console.warn(`no box "${label}" in ${shot}`); return null; }
  return { x: b.x, y: b.y, w: b.w, h: b.h };
}
// A shot starts recording before it navigates, so a chapter's clip starts at its first mark, where
// its page has loaded; frame 0 is still the previous page.
/** Clip-local output time for a source time, or null when it was cut. */
function outAt(c, ts) { for (const g of c.segs) if (ts >= g.a && ts <= g.b) return g.o0 + (g.b > g.a ? (ts - g.a) / (g.b - g.a) : 0) * (g.o1 - g.o0); return null; }
function frameAt(shot, ts) {
  const fr = CAP[shot]?.frames || []; let lo = 0, hi = fr.length - 1, best = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (fr[m].t <= ts * 1000) { best = m; lo = m + 1; } else hi = m - 1; }
  return fr[best]?.f ?? 0;
}
function cursorAt(shot, ts) {
  const ev = (CAP[shot]?.events || []).filter((e) => e.type === "move" || e.type === "click");
  let x = 720, y = 520, seen = false, clickAge = 99, cx = 0, cy = 0;
  for (const e of ev) {
    const et = e.t / 1000; if (et > ts) break;
    if (e.type === "move") { const k = E.inOut(clamp((ts - et) / .45)); x = lerp(x, e.x, k); y = lerp(y, e.y, k); seen = true; }
    else { clickAge = ts - et; cx = e.x; cy = e.y; }
  }
  return { x, y, seen, clickAge, cx, cy };
}

// ───────────────────────────── storyboard ─────────────────────────────
const SCENES = [];
let T = 0;
const add = (s) => { if (s.clip) s.dur = (s.lead ?? .8) + s.clip.dur + (s.tail ?? .5); s.t0 = T; s.t1 = T + s.dur; T = s.t1; SCENES.push(s); return s; };

add({ id: "hook", dur: 6.8 });
add({ id: "split", dur: 12 });

  clip: clip("playground", [
    { from: "start", to: "Start my Researcher", speed: 1 },

    { from: "answered", to: "Why? Check its receipt", speed: 1 },

  caps: [

    ["Why? Check its receipt", .1, 4.2, "Every answer has a <b>receipt</b>. Anyone can check it against Sui, no sign-in."],

add({

  clip: clip("scout", [
    { from: "remora", to: "question", speed: 1 },
    { from: "question", to: "Ask", speed: 2.8, badge: "Typing · 2.8×" },
    { from: "Ask", to: "answered", dur: 3.4, badge: "Buying a Sui risk check over x402 · sped up" },
    { from: "answered", to: "Why?", speed: 1 },
    { from: "Why?", to: "end", speed: 1.5 },
  ]),

    const done = i < cur, active = i === cur, d = $(`sd${i}`);
    const html = done ? icon("check", "#0d0d0d", 16, 3) : String(i + 1);
    if (d.dataset.v !== html) { d.dataset.v = html; d.innerHTML = html; }
    d.style.background = done ? "var(--ink)" : active ? "var(--accent)" : "transparent";
    d.style.color = done || active ? "#fff" : "var(--dim)";
    d.style.border = done || active ? "none" : "1.5px solid rgba(255,255,255,.2)";
    $(`sl${i}`).style.color = active ? "var(--ink)" : done ? "var(--ink2)" : "var(--dim)";
    $(`si${i}`).style.background = active ? "var(--accent-soft)" : "transparent";
    const ln = $(`sn${i}`);

}
/** The footage window's scale: 1440×936 → 1267×824, so the caption track sits below it. */
const WIN_S = .88;
async function setWin(s, t) {
  const lt = t - s.t0, c = s.clip, lead = s.lead ?? .8;

  css("win", { o: Math.min(inK, 1 - outK), y: (1 - inK) * 50, s: WIN_S * lerp(.965, 1, inK) });
  css("url-t", { text: s.url });

  const { ts, seg } = srcAt(c, cl);
  const img = $("shot"); const src = `capture/${c.shot}/${String(frameAt(c.shot, ts)).padStart(5, "0")}.jpg`;
  if (!img.src.endsWith(src)) { img.src = src; try { await img.decode(); } catch { /* keep the last frame */ } }
  const cu = cursorAt(c.shot, ts);
  $("cursor").setAttribute("transform", `translate(${cu.x},${cu.y})`);
  $("cursor").setAttribute("opacity", cu.seen ? "1" : "0");
  const rk = clamp(cu.clickAge / .5);
  $("ripple").setAttribute("opacity", cu.clickAge < .5 ? String(1 - rk) : "0");
  $("rip").setAttribute("cx", cu.cx); $("rip").setAttribute("cy", cu.cy); $("rip").setAttribute("r", String(8 + rk * 26));
  const b = $("badge");

    if (!sp.r) continue;
    const a = mark(c.shot, sp.at) + sp.off, k = Math.min(P(ts, a, a + .45), 1 - P(ts, a + sp.len - .45, a + sp.len));

  const zoom = lerp(1, best?.zoom ?? 1, bk), zx = best ? best.r.x + best.r.w / 2 : 720, zy = best ? best.r.y + best.r.h / 2 : 450;
  $("cam").style.transform = `translate(${(1 - zoom) * zx}px, ${(1 - zoom) * zy}px) scale(${zoom})`;
  const sk = Math.min(P(lt, .3, .8), 1 - P(t, s.t1 - .5, s.t1, E.in));
  css("steps", { o: sk, y: (1 - P(lt, .3, .8, E.out5)) * -24 });
  setSteps(s, lt < lead ? -1 : ts);
}

async function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  drawBg(t);
  let cur = SCENES[0]; for (const s of SCENES) if (t >= s.t0) cur = s;
  for (const s of SCENES) {
    const el = SC[s.id]; if (!el) continue;
    const on = s === cur && !s.clip; el.style.display = on ? "block" : "none"; if (!on) continue;
    const lt = t - s.t0; el.style.opacity = String(Math.min(P(lt, 0, .4), 1 - P(t, s.t1 - .4, s.t1, E.in)));
    U[s.id](lt);
  }
  $("win").style.display = cur.clip ? "block" : "none";
  if (cur.clip) await setWin(cur, t); else css("steps", { o: 0 });
  // Captions: in from below with a blur, out quickly; one at a time.
  CAPS.forEach((c, i) => {
    const el = $(`cap${i}`); const a2 = c.a + .12, vis = t > a2 - .02 && t < c.b + .18;
    el.style.display = vis ? "block" : "none"; if (!vis) return;
    const pin = P(t, a2, a2 + .45, E.out5), pout = P(t, c.b, c.b + .15, E.in);
    el.style.transform = `translate(-50%, ${(1 - pin) * 26 - pout * 14}px)`;
    el.style.opacity = String(Math.min(clamp((t - a2) / .15), 1 - pout));
    el.style.filter = pin < .98 ? `blur(${(1 - pin) * 8}px)` : "none";
  });

  $("prog-i").style.transform = `scaleX(${t / DUR})`;
}
window.render = render;

// ───────────────────────────── audio ─────────────────────────────
// A calm bed (Am7 · Fmaj7 · C · G at 92 BPM) with a generated reverb, a whoosh into every scene, a key
// tick for every character typed in the footage, a click for every real click, and a chime when a
// step checks out. Synthesised; no samples.
async function renderAudio(sr = 48000) {
  const ctx = new OfflineAudioContext(2, Math.ceil(DUR * sr), sr);
  const master = ctx.createGain(); master.gain.value = .8;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
  master.connect(comp); comp.connect(ctx.destination);

  const rev = ctx.createConvolver();

    const len = Math.floor(sr * 2.4), ir = ctx.createBuffer(2, len, sr);
    let seed = 7;
    const r = () => {
      seed = (seed * 1664525 + 1013904223) >>> 0;

    };
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = r() * (1 - i / len) ** 3; }
    rev.buffer = ir;
  }
  const revGain = ctx.createGain(); revGain.gain.value = .32; rev.connect(revGain); revGain.connect(master);
  const mtof = (m) => 440 * 2 ** ((m - 69) / 12);
  const pan = (p) => { const n = ctx.createStereoPanner(); n.pan.value = p; return n; };
  const BEAT = 60 / 92, BAR = BEAT * 4;
  const PROG = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 55, 60, 64], [55, 59, 62, 67]];
  const ROOT = [45, 41, 36, 43];
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1600; lp.connect(master); lp.connect(rev);
  for (let bar = 0; bar * BAR < DUR; bar++) {
    const t0 = bar * BAR, ch = PROG[bar % 4];
    for (const [i, m] of ch.entries()) for (const det of [-6, 6]) {
      const o = ctx.createOscillator(); o.type = i % 2 ? "triangle" : "sawtooth"; o.frequency.value = mtof(m); o.detune.value = det;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.013, t0 + .9); g.gain.setValueAtTime(.013, t0 + BAR - .2); g.gain.linearRampToValueAtTime(0, t0 + BAR + .9);
      const p = pan(det < 0 ? -.45 : .45); o.connect(g); g.connect(p); p.connect(lp); o.start(t0); o.stop(t0 + BAR + 1);
    }
    if (t0 > 6.2 && t0 < DUR - 7.5) {
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = mtof(ROOT[bar % 4]);
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.2, t0 + .05); g.gain.exponentialRampToValueAtTime(.001, t0 + BAR * .9);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + BAR);
      for (let b = 0; b < 4; b++) {
        const tt = t0 + b * BEAT; const k = ctx.createOscillator(); k.type = "sine";
        k.frequency.setValueAtTime(110, tt); k.frequency.exponentialRampToValueAtTime(48, tt + .12);
        const kg = ctx.createGain(); kg.gain.setValueAtTime(.28, tt); kg.gain.exponentialRampToValueAtTime(.001, tt + .3);
        k.connect(kg); kg.connect(master); k.start(tt); k.stop(tt + .32);
        const h = ctx.createOscillator(); h.type = "triangle"; h.frequency.value = mtof(PROG[bar % 4][(b + 1) % 4] + 24);
        const hg = ctx.createGain(); const ht = tt + BEAT / 2; hg.gain.setValueAtTime(0, ht); hg.gain.linearRampToValueAtTime(.032, ht + .01); hg.gain.exponentialRampToValueAtTime(.001, ht + .25);
        const p = pan((b % 2) * .6 - .3); h.connect(hg); hg.connect(p); p.connect(master); p.connect(rev); h.start(ht); h.stop(ht + .3);
      }

    const d = noiseBuf.getChannelData(0); let s = 3;

  }

    const a = Math.max(0, s.t0 - .5), src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.4; bp.frequency.setValueAtTime(400, a); bp.frequency.exponentialRampToValueAtTime(3800, s.t0 + .1);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(.09, s.t0 + .01); g.gain.exponentialRampToValueAtTime(.001, s.t0 + .5);

    if (!s.clip) continue;
    const c = s.clip, ev = CAP[c.shot]?.events || [], base = s.t0 + (s.lead ?? .8);
    const at = (ts) => { const o = outAt(c, ts); return o === null ? null : base + o; };
    for (const e of ev) {
      if (e.type === "click") { const t = at(e.t / 1000); if (t !== null && t < s.t1) { tick(t, .16, 2400); tone(t, 84, .06, .05, "sine", .1, false); } }
      if (e.type === "type") for (let i = 0; i < (e.label || "").length; i++) { const t = at(e.t / 1000 + .3 + i * .055); if (t !== null && t < s.t1) tick(t, .035, 2800 + (i % 5) * 300); }
    }
    for (let i = 0; i < (s.steps || []).length; i++) { const t = at(stepAt(s, i)); if (t !== null && t < s.t1) { tone(t, 79, .5, .07); tone(t + .07, 86, .6, .06); } }
  }
  const sp = SCENES.find((s) => s.id === "split"); if (sp) { tone(sp.t0 + 5.6, 40, .5, .45); tone(sp.t0 + 8.2, 76, .5, .1); tone(sp.t0 + 8.27, 83, .6, .09); }
  const atk = SCENES.find((s) => s.id === "attack"); if (atk) for (const h of [6.0, 8.0, 10.0]) { tone(atk.t0 + h, 40, .4, .45); tone(atk.t0 + h, 64, .2, .05, "square"); }
  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1); const pcm = new Int16Array(L.length * 2);
  for (let i = 0; i < L.length; i++) { pcm[2 * i] = Math.max(-1, Math.min(1, L[i])) * 32767; pcm[2 * i + 1] = Math.max(-1, Math.min(1, R[i])) * 32767; }
  window.__pcm = new Uint8Array(pcm.buffer); return window.__pcm.length;
}
window.renderAudio = renderAudio;
window.pcmChunk = (i, size) => {
  const b = window.__pcm.subarray(i * size, (i + 1) * size); let s = "";
  for (let k = 0; k < b.length; k += 0x8000) s += String.fromCharCode.apply(null, b.subarray(k, k + 0x8000));
  return btoa(s);
};

window.ready = (async () => {
  for (const s of SCENES) { const h = SC[s.id]?.querySelector(".h"); if (h) h.id = `${s.id}-h`; }
  await document.fonts.ready;
  const q = new URLSearchParams(location.search);
  if (q.has("t")) { await render(Number(q.get("t"))); return true; }
  if (q.has("render")) { await render(0); return true; }
  const start = performance.now(); let busy = false;
  const loop = async () => { if (!busy) { busy = true; await render(((performance.now() - start) / 1000) % DUR); busy = false; } requestAnimationFrame(loop); };
  loop(); return true;
})();
