  ADR-0091: the demo video. The real app on Sui testnet, recorded by e2e/tests/demo.spec.ts, played
  inside a window and told as problem → fix, with SVG callouts, a cursor and diagrams drawn in the
  app's own design system (openbot tokens: canvas #f5f5f6, white sheets, ink #141414, accent #007cf7,
  success, warning, danger; radii 14/16/20; Inter). Every frame is a pure function of time:
  `render(t)` sets the stage and resolves once the footage frame is decoded, so render.ts can capture
  it frame by frame. Footage times come from the capture's own marks, so a re-capture needs no edits.

"use strict";
// ───────────────────────────── engine ─────────────────────────────
const FPS = 30;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  out: (x) => 1 - (1 - x) ** 3, out5: (x) => 1 - (1 - x) ** 5, in: (x) => x * x * x,
  inOut: (x) => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  back: (x) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; },
};
const P = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
const $ = (id) => document.getElementById(id);
function css(el, o) {
  if (typeof el === "string") el = $(el);
  if (!el) return;
  const tr = [];
  if (o.x !== undefined || o.y !== undefined) tr.push(`translate(${o.x || 0}px, ${o.y || 0}px)`);
  if (o.s !== undefined) tr.push(`scale(${o.s})`);
  if (o.r !== undefined) tr.push(`rotate(${o.r}deg)`);
  if (tr.length) el.style.transform = tr.join(" ");
  if (o.o !== undefined) el.style.opacity = o.o;
  if (o.blur !== undefined) el.style.filter = o.blur > 0.05 ? `blur(${o.blur}px)` : "none";
  if (o.text !== undefined && el.textContent !== o.text) el.textContent = o.text;
}
const rise = (el, t, a, d = .6, dist = 24) => { const k = P(t, a, a + d, E.out5); css(el, { o: k, y: (1 - k) * dist, blur: (1 - k) * 6 }); return k; };
const LOGO = '<svg width="34" height="34" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#6054ec"/><svg x="20" y="20" width="60" height="60" viewBox="276 96 348 348"><path fill="#fff" d="M330 120H360V420H330A30 30 0 0 1 300 390V150A30 30 0 0 1 330 120ZM360 120H510A30 30 0 0 1 540 150V180H360ZM540 180H570A30 30 0 0 1 600 210V270A30 30 0 0 1 570 300H540ZM360 240H540V300H360ZM480 300H540V360H510A30 30 0 0 1 480 330ZM540 360H600V390A30 30 0 0 1 570 420H540Z"/></svg></svg>';
$("hud-brand").innerHTML = `${LOGO}<span>remora</span>`;
// Lucide-style icons (24 grid, 2px strokes), drawn here so the page needs nothing else.
const IC = {

  alert: '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',

  receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.7 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1Z"/>',
  brain: '<path d="M12 5a3 3 0 1 0-6 .1 4 4 0 0 0-2.5 5.8 4 4 0 0 0 .6 6.6A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 6 .1 4 4 0 0 1 2.5 5.8 4 4 0 0 1-.6 6.6A4 4 0 1 1 12 18Z"/><path d="M12 5v13"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  pause: '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
  fish: '<path d="M6.5 12c.9-3.6 4.2-6 8-6 3.5 0 6 3 7.5 6-1.5 3-4 6-7.5 6-3.8 0-7.1-2.4-8-6Z"/><path d="M6.5 12 2 8v8Z"/><path d="M17 12h.01"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
};
const icon = (k, c = "currentColor", s = 26, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

// ───────────────────────────── footage ─────────────────────────────
const CAP = window.CAPTURE || {};
/** A mark's source time (s) in a shot: the first event with that label. */
function mark(shot, label) {
  const m = CAP[shot]; if (!m) return 0;
  if (label === "start") return 0; if (label === "end") return m.duration / 1000;
  const e = m.events.find((x) => x.label === label);
  return e ? e.t / 1000 : 0;
}
/**
 * A clip plays a shot through segments: each from one mark to the next, at a speed or in a set
 * time. Long waits on the chain are shown sped up, with a badge saying so.
 */
function clip(shot, segs) {
  let out = 0;
  const S = segs.map((s) => {
    const a = mark(shot, s.from) + (s.fromOff || 0), b = mark(shot, s.to) + (s.toOff || 0);
    const dur = s.dur ?? Math.max(.01, (b - a) / (s.speed || 1));
    const r = { a, b, o0: out, o1: out + dur, badge: s.badge };
    out += dur; return r;
  });
  return { shot, segs: S, dur: out };
}
/** Source time for a clip at local output time lt. */
function srcAt(c, lt) {
  for (const s of c.segs) if (lt < s.o1 || s === c.segs.at(-1)) { const k = clamp((lt - s.o0) / (s.o1 - s.o0)); return { ts: lerp(s.a, s.b, k), seg: s }; }
  return { ts: 0, seg: c.segs[0] };
}
function frameAt(shot, ts) {
  const fr = CAP[shot]?.frames || []; let lo = 0, hi = fr.length - 1, best = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (fr[m].t <= ts * 1000) { best = m; lo = m + 1; } else hi = m - 1; }
  return fr[best]?.f ?? 0;
}
function cursorAt(shot, ts) {
  const ev = (CAP[shot]?.events || []).filter((e) => e.type === "move" || e.type === "click");
  let x = 720, y = 520, seen = false, clickAge = 99, cx = 0, cy = 0;
  for (const e of ev) {
    const et = e.t / 1000; if (et > ts) break;
    if (e.type === "move") { const k = E.inOut(clamp((ts - et) / .45)); x = lerp(x, e.x, k); y = lerp(y, e.y, k); seen = true; if (k >= 1) { x = e.x; y = e.y; } }
    else { clickAge = ts - et; cx = e.x; cy = e.y; }
  }
  return { x, y, seen, clickAge, cx, cy };
}

// ───────────────────────────── storyboard ─────────────────────────────
// Each scene: a duration (or a clip's), copy on the left, and what the window shows.
const PROBLEM = (t) => `<span class="pill bad"><span class="d"></span>The problem</span><div class="h3" style="margin-top:14px">${t}</div>`;
const FIX = (t, b) => `<span class="pill ok"><span class="d"></span>The fix</span><div class="h2" style="margin-top:14px">${t}</div>${b ? `<div class="body" style="margin-top:12px">${b}</div>` : ""}`;
/** The problem, then the fix, in the left column. */
const PF = (p, f, b) => `${PROBLEM(p)}<div style="height:30px"></div>${FIX(f, b)}`;
const SCENES = [];
let T = 0;
const add = (s) => {
  // A footage scene lasts its lead-in, its clip and a short tail.
  if (s.clip) s.dur = s.lead + s.clip.dur + (s.tail ?? .6);
  s.t0 = T; s.t1 = T + s.dur; T = s.t1; SCENES.push(s); return s;
};

// A calm bed under the product: soft pads and a light pulse, a tick on every real click, a chime

    const outT = (ts) => { for (const g of c.segs) if (ts >= g.a && ts <= g.b) return s.t0 + s.lead + g.o0 + (g.b > g.a ? (ts - g.a) / (g.b - g.a) : 0) * (g.o1 - g.o0); return null; };

    for (const [, m] of s.steps || []) { const at = outT(mark(c.shot, m)); if (at !== null && at < s.t1) { tone(at, 79, .5, .09); tone(at + .07, 84, .6, .08); } }
  }
  // The attack scene: three dull hits on the layers.
  const at = SCENES.find((s) => s.id === "attack");
  if (at) for (const h of [5.4, 7.6, 9.8]) { tone(at.t0 + h, 40, .4, .5); tone(at.t0 + h, 64, .2, .06, "square"); }
  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1); const pcm = new Int16Array(L.length * 2);
  for (let i = 0; i < L.length; i++) { pcm[2 * i] = Math.max(-1, Math.min(1, L[i])) * 32767; pcm[2 * i + 1] = Math.max(-1, Math.min(1, R[i])) * 32767; }
  window.__pcm = new Uint8Array(pcm.buffer); return window.__pcm.length;
}
window.renderAudio = renderAudio;
window.pcmChunk = (i, size) => {
  const b = window.__pcm.subarray(i * size, (i + 1) * size); let s = "";
  for (let k = 0; k < b.length; k += 0x8000) s += String.fromCharCode.apply(null, b.subarray(k, k + 0x8000));
  return btoa(s);
};

window.ready = (async () => {
  await document.fonts.ready;
  const q = new URLSearchParams(location.search);
  if (q.has("t")) { await render(Number(q.get("t"))); return true; }
  if (q.has("render")) { await render(0); return true; }
  const start = performance.now(); let busy = false;
  const loop = async () => { if (!busy) { busy = true; await render(((performance.now() - start) / 1000) % DUR); busy = false; } requestAnimationFrame(loop); };
  loop(); return true;
})();
</script>
