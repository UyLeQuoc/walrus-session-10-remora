<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remora showreel</title>
<meta name="viewport" content="width=1920">
<!--
  ADR-0090: a 180 s motion-graphics showreel, drawn from code. Every frame is a pure function of
  time: `render(t)` sets the whole stage for second t, so `render.ts` can capture frame by frame
  and the music (synthesised with WebAudio from the same cue list) lands on the cuts.
  Open it in a browser to watch it live; `?t=42.5` shows one still.
  Ids, digests, prices and timings on screen come from recorded runs (docs/spikes, the Oct 31 e2e).
  The wallet's unknown coin and the stream's cells are illustrations, labelled as such by their shape.
-->
<style>
  :root {
    --bg: #1f1e1c; --bg2: #151413; --card: #2a2926; --card2: #24231f; --line: rgba(255,255,255,.09);
    --text: #f5f4f0; --muted: #b9b6ad; --dim: #8f8b82; --indigo: #6054ec; --indigo2: #a59cf7;
    --teal: #2bb3a6; --green: #2fbf71; --red: #e5674e; --amber: #f0a646;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  canvas#bg, canvas#grain { position: absolute; inset: 0; }
  #grain { mix-blend-mode: overlay; opacity: .32; }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
  .abs { position: absolute; }
  .card { background: linear-gradient(180deg, #2c2b28, #252421); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .mono { font-family: var(--mono); }
  .eyebrow { font-size: 20px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--indigo2); }
  .h1 { font-size: 120px; font-weight: 750; letter-spacing: -.045em; line-height: 1.02; }
  .h2 { font-size: 84px; font-weight: 720; letter-spacing: -.04em; line-height: 1.05; }
  .h3 { font-size: 46px; font-weight: 680; letter-spacing: -.03em; line-height: 1.12; }
  .body { font-size: 28px; color: var(--muted); line-height: 1.4; }
  .small { font-size: 22px; color: var(--dim); }
  .chip { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.04); font-size: 22px; color: #d8d5cc; white-space: nowrap; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .pill { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 20px; font-weight: 600; }
  .ok { color: var(--green); } .bad { color: var(--red); } .ind { color: var(--indigo2); } .amb { color: var(--amber); }
  .strike { position: absolute; left: -2%; top: 50%; height: 6px; width: 0; background: var(--red); border-radius: 3px; transform: rotate(-3deg); }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud .tl { position: absolute; left: 64px; top: 48px; display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 26px; letter-spacing: -.02em; }
  #hud .tr { position: absolute; right: 64px; top: 54px; font-size: 18px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; font-weight: 600; }
  #hud .bl { position: absolute; left: 64px; bottom: 50px; font-size: 20px; color: var(--muted); display: flex; gap: 16px; align-items: baseline; }
  #hud-num { color: var(--indigo2); font-family: var(--mono); font-weight: 600; }
  #hud .bar { position: absolute; left: 64px; right: 64px; bottom: 34px; height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
  #hud .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--indigo), var(--teal)); }
  #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(165,156,247,.55), rgba(96,84,236,.15) 60%, transparent); opacity: 0; pointer-events: none; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); pointer-events: none; }
  .node { position: absolute; width: 230px; height: 120px; border-radius: 22px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; text-align: center; z-index: 2; }
  .node b { font-size: 28px; letter-spacing: -.02em; }
  .node span { font-size: 18px; color: var(--dim); }
  .label { position: absolute; font-family: var(--mono); font-size: 21px; padding: 10px 16px; border-radius: 12px; background: rgba(21,20,19,.9); border: 1px solid var(--line); white-space: nowrap; z-index: 3; }
  .shot { position: absolute; border-radius: 18px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); background: #111; }
  .shot img { display: block; width: 100%; }
  .stat { position: absolute; width: 520px; height: 230px; padding: 36px 40px; display: flex; flex-direction: column; justify-content: space-between; }
  .stat .n { font-size: 92px; font-weight: 760; letter-spacing: -.05em; line-height: 1; }
  .stat .t { font-size: 24px; color: var(--muted); }
  .term { font-family: var(--mono); font-size: 23px; line-height: 1.6; color: #d8d5cc; white-space: pre; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="scenes"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="960" height="540" style="width:1920px;height:1080px"></canvas>
  <div id="hud">
    <div class="tl" id="hud-logo"></div>
    <div class="tr" id="hud-tr">Walrus × Tatum · Total Recall</div>
    <div class="bl" id="hud-chapter"><b id="hud-num"></b><span id="hud-title"></span></div>
    <div class="bar"><i id="hud-bar"></i></div>
  </div>
</div>
<script>
"use strict";
// ───────────────────────────── engine ─────────────────────────────
const W = 1920, H = 1080, FPS = 30, DUR = 180;
const LOGO_VB = "276 96 348 348";
const LOGO_D = "M330 120H360V420H330A30 30 0 0 1 300 390V150A30 30 0 0 1 330 120ZM360 120H510A30 30 0 0 1 540 150V180H360ZM540 180H570A30 30 0 0 1 600 210V270A30 30 0 0 1 570 300H540ZM360 240H540V300H360ZM480 300H540V360H510A30 30 0 0 1 480 330ZM540 360H600V390A30 30 0 0 1 570 420H540Z";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: (x) => x,
  out: (x) => 1 - (1 - x) ** 3,
  out5: (x) => 1 - (1 - x) ** 5,
  inOut: (x) => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  back: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; },
  expo: (x) => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  in: (x) => x * x * x,
};
/** Progress of t through [a, b], eased. */
const P = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
/** In over [a, a+d], out over [b-d2, b]. */
const inout = (t, a, b, d = .6, d2 = .5) => Math.min(P(t, a, a + d), 1 - P(t, b - d2, b, E.in));
const $ = (id) => document.getElementById(id);
function css(el, o) {
  if (typeof el === "string") el = $(el);
  if (!el) return;
  const tr = [];
  if (o.x !== undefined || o.y !== undefined) tr.push(`translate(${o.x || 0}px, ${o.y || 0}px)`);
  if (o.z !== undefined) tr.push(`translateZ(${o.z}px)`);
  if (o.ry !== undefined) tr.push(`rotateY(${o.ry}deg)`);
  if (o.rx !== undefined) tr.push(`rotateX(${o.rx}deg)`);
  if (o.r !== undefined) tr.push(`rotate(${o.r}deg)`);
  if (o.s !== undefined) tr.push(`scale(${o.s})`);
  el.style.transform = tr.join(" ");
  if (o.o !== undefined) el.style.opacity = o.o;
  if (o.blur !== undefined) el.style.filter = o.blur > 0.05 ? `blur(${o.blur}px)` : "none";
  if (o.w !== undefined) el.style.width = typeof o.w === "number" ? `${o.w}px` : o.w;
  if (o.text !== undefined && el.textContent !== o.text) el.textContent = o.text;
}
/** Reveal-in-place: fade, rise, unblur. */
const rise = (el, t, a, d = .7, dist = 40) => { const k = P(t, a, a + d, E.out5); css(el, { o: k, y: (1 - k) * dist, blur: (1 - k) * 10 }); return k; };
const pop = (el, t, a, d = .55) => { const k = P(t, a, a + d, E.back); const f = P(t, a, a + d * .5); css(el, { o: f, s: lerp(.82, 1, k) }); return k; };
const typed = (s, t, a, cps = 28) => s.slice(0, Math.max(0, Math.floor((t - a) * cps)));
// Seeded PRNG so every frame is reproducible.
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
const logoSvg = (size, fill = "#fff", tile = "#6054ec", r = .24) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><rect width="100" height="100" rx="${r * 100}" fill="${tile}"/><svg x="20" y="20" width="60" height="60" viewBox="${LOGO_VB}"><path fill="${fill}" d="${LOGO_D}"/></svg></svg>`;

// ───────────────────────────── timeline ─────────────────────────────
// Scene windows (seconds). Cues drive the cuts, the HUD and the music.
const S = {
  open: [0, 9.2], problem: [9.2, 21], promise: [21, 40], m1: [40, 70], m2: [70, 95],
  m3: [95, 117], m4: [117, 132], trust: [132, 152], product: [152, 167], numbers: [167, 176.2], outro: [176.2, 180],
};
const CHAPTERS = [
  [S.problem[0], "00", "The half-green row"], [S.promise[0], "00", "Three promises"],
  [S.m1[0], "01", "An unknown token lands"], [S.m2[0], "02", "It learns from you"],
  [S.m3[0], "03", "A paid answer tries to steal"], [S.m4[0], "04", "A key pays without a decision"],
  [S.trust[0], "05", "Memory that knows what holds"], [S.product[0], "06", "The product"],
  [S.numbers[0], "07", "Built on Walrus, Sui and Tatum"],
];
// Sound cues: cuts get an impact, events get a blip (see the audio section).
const CUES = {
  impacts: [6.0, 9.2, 21, 40, 70, 95, 117, 132, 152, 167, 176.2],
  risers: [[3.2, 6.0], [37.6, 40], [92.6, 95], [149.6, 152], [173.6, 176.2]],
  blips: [
    [12.4, 2], [13.6, 2], [15.2, 1], [16.6, 1], [23, 3], [28.6, 3], [34.2, 3], [38.2, 4],
    [43.4, 3], [45.2, 2], [48.6, 3], [51, 3], [53.4, 3], [55.8, 3], [58.2, 4], [61.6, 3], [65.6, 4],
    [73.6, 2], [76.2, 1], [79.4, 3], [84.2, 4], [87.2, 2], [89, 4],
    [104.4, 5], [107.4, 5], [110.4, 5], [121.6, 5], [125.2, 3], [128.4, 4],
    [135.2, 3], [137.4, 4], [140.6, 5], [143.6, 3], [146, 3], [148.6, 4],
  ],
  glitch: [[96.2, 2.2], [104.2, .5], [107.2, .5], [110.2, .6], [121.4, .6]],
};
window.CUES = CUES; window.DUR = DUR; window.FPS = FPS;

// ───────────────────────────── scenes (DOM) ─────────────────────────────
const SC = {};
function scene(id, html) {
  const el = document.createElement("section");
  el.className = "scene"; el.id = id; el.innerHTML = html;
  $("scenes").appendChild(el); SC[id] = el; return el;
}
$("hud-logo").innerHTML = `${logoSvg(34)}<span>remora</span>`;

// 1 · open
scene("open", `
  <div class="abs" id="o-logo" style="left:860px;top:300px;width:200px;height:200px">${logoSvg(200)}</div>
  <div class="abs" id="o-word" style="left:0;right:0;top:540px;text-align:center;font-size:128px;font-weight:760;letter-spacing:-.05em">${"remora".split("").map((c, i) => `<span id="o-w${i}" style="display:inline-block">${c}</span>`).join("")}</div>
  <div class="abs body" id="o-tag" style="left:0;right:0;top:720px;text-align:center;font-size:40px;color:#d8d5cc">Always-on agents you actually own.</div>
`);
// 2 · problem
scene("problem", `
  <div class="abs eyebrow" id="p-eb" style="left:160px;top:190px">Agents can run errands now</div>
  <div class="abs h2" id="p-h" style="left:160px;top:240px;width:1500px">To let one spend, you either…</div>
  <div class="abs card" id="p-a" style="left:160px;top:420px;width:760px;height:200px;padding:44px 48px">
    <div class="h3">Hand it your whole wallet</div><div class="body" style="margin-top:12px">One leaked key, one obedient model, gone.</div>
    <div class="strike" id="p-sa"></div></div>
  <div class="abs card" id="p-b" style="left:1000px;top:420px;width:760px;height:200px;padding:44px 48px">
    <div class="h3">…or approve every click</div><div class="body" style="margin-top:12px">Then it isn't an agent. It's a form.</div>
    <div class="strike" id="p-sb"></div></div>
  <div class="abs card" id="p-row" style="left:160px;top:690px;width:1600px;height:230px;padding:38px 48px">
    <div class="small" style="letter-spacing:.16em;text-transform:uppercase;font-weight:600">Rails Before Robots · the Oct 15 audit of Sui's agent stack</div>
    <div style="display:flex;align-items:center;gap:40px;margin-top:34px">
      <div class="h3" style="width:420px">Spending limits</div>
      <div style="flex:1;height:34px;border-radius:17px;background:rgba(255,255,255,.07);position:relative;overflow:hidden">
        <div id="p-half" style="position:absolute;left:0;top:0;bottom:0;width:0;background:#3d8a62"></div>
        <div id="p-full" style="position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--indigo),var(--teal))"></div>
      </div>
      <div id="p-lab" class="h3" style="width:300px;text-align:right;font-size:38px"></div>
    </div>
    <div class="body" id="p-note" style="margin-top:22px;font-size:24px">App-bound allowances shipped on Sui. No agent product used them.</div>
  </div>
`);
// 3 · promise
const promiseCol = (id, x, title, sub, inner) => `
  <div class="abs card" id="${id}" style="left:${x}px;top:250px;width:520px;height:640px;padding:40px 40px">
    <div class="h3" style="font-size:36px;white-space:nowrap">${title}</div>
    <div class="body" style="font-size:23px;margin-top:10px;height:66px">${sub}</div>
    <div style="position:relative;height:420px;margin-top:24px">${inner}</div>
  </div>`;
scene("promise", `
  <div class="abs eyebrow" id="r-eb" style="left:160px;top:150px">Every remora has three things most agents don't</div>
  ${promiseCol("r-disc", 160, "A budget Sui enforces", "The <b style='color:var(--text)'>Disc</b>: Sui's app-bound allowances, issued with one signature.", `
    <svg class="abs" style="left:110px;top:0" width="220" height="220" viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="92" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="16"/>
      <circle id="r-ring" cx="110" cy="110" r="92" fill="none" stroke="url(#rg)" stroke-width="16" stroke-linecap="round" transform="rotate(-90 110 110)" stroke-dasharray="578" stroke-dashoffset="578"/>
      <defs><linearGradient id="rg"><stop offset="0" stop-color="#6054ec"/><stop offset="1" stop-color="#2bb3a6"/></linearGradient></defs>

    ${["Monthly limit · 0.50 USDC", "Per payment · ≤ 0.015", "Payees · reef:sui-risk, odds, brief", "Revoke · rotate · pause from your wallet"].map((s, i) => `<div class="abs" id="r-d${i}" style="left:0;top:${248 + i * 44}px;font-size:22px;color:#d8d5cc"><span class="dot" style="background:var(--indigo);margin-right:12px;width:10px;height:10px"></span>${s}</div>`).join("")}
  `)}
  ${promiseCol("r-mem", 700, "A memory you can read", "On <b style='color:var(--text)'>Walrus</b>. It learns from your 👍 and 👎.", `
    ${[["L62Puk00…", "wake"], ["BHKSzsxP…", "wake"], ["Yb9ZNt1r…", "episode"], ["rbQ84ahd…", "rule"], ["HRUVHGMm…", "rule"], ["0DnrCtw3…", "wake"]].map(([id, ty], i) => `
      <div class="abs" id="r-b${i}" style="left:${(i % 2) * 222}px;top:${Math.floor(i / 2) * 92}px;width:206px;height:78px;border-radius:16px;border:1px solid ${ty === "rule" ? "rgba(96,84,236,.7)" : "var(--line)"};background:${ty === "rule" ? "rgba(96,84,236,.18)" : "rgba(255,255,255,.04)"};padding:12px 16px">
        <div class="mono" style="font-size:19px;color:${ty === "rule" ? "var(--indigo2)" : "#d8d5cc"}">${id}</div><div class="small" style="font-size:16px;margin-top:4px">${ty}</div></div>`).join("")}
    <div class="abs" id="r-mt" style="left:0;top:300px;font-size:22px;color:#d8d5cc;line-height:1.75">Inspect · correct · forget · export<br><span class="ind">→ Claude Code, over MCP</span></div>
  `)}
  ${promiseCol("r-wake", 1240, "A receipt for every decision", "The <b style='color:var(--text)'>Wake</b>. Payment intents are anchored onchain.", `
    <div class="abs" id="r-paper" style="left:30px;top:0;width:380px;height:330px;border-radius:14px;background:#f5f4f0;color:#1f1e1c;padding:26px 28px;overflow:hidden">

      ${["trigger    message", "memories   rbQ84ahd…", "paid       0.01 USDC", "payee      reef:sui-risk", "sonar      allow", "intent     → Paid.intent"].map((l, i) => `<div class="mono" id="r-l${i}" style="font-size:17px;line-height:1.9;white-space:pre">${l}</div>`).join("")}
    </div>
    <div class="abs" id="r-stamp" style="left:200px;top:282px;padding:10px 18px;border:4px solid var(--green);color:var(--green);border-radius:12px;font-weight:800;font-size:24px;letter-spacing:.08em;transform:rotate(-8deg);background:rgba(245,244,240,.92)">ANCHORED ✓</div>
    <div class="abs" id="r-wt" style="left:0;top:360px;font-size:22px;color:#d8d5cc">Anyone can check it at <span class="mono ind">/verify</span></div>
  `)}
`);
// 4 · moment 1 (x402)
const chapterCard = (n, title, sub) => `
  <div class="abs" id="CH" style="left:0;right:0;top:330px;text-align:center">

scene("m1", `
  ${chapterCard("01", "An unknown token lands", "Sentinel watches. Scout checks. Over x402, settled on Sui.").replace('id="CH"', 'id="m1-ch"')}
  <div class="abs card" id="m1-wallet" style="left:110px;top:190px;width:500px;height:300px;padding:34px 38px">
    <div class="small" style="letter-spacing:.14em;text-transform:uppercase;font-weight:600">Your wallet · testnet</div>

      <div><div style="font-size:28px;font-weight:700">+ 50,000 ???</div><div class="small" style="font-size:18px">an unknown coin type</div></div><span class="pill" style="background:rgba(240,166,70,.18);color:var(--amber)">new</span></div>
    <div class="small" style="margin-top:22px;font-size:19px">Watched through Tatum's <span class="mono">SubscribeCheckpoints</span></div>
  </div>
  <div class="abs card" id="m1-ping" style="left:110px;top:520px;width:500px;height:170px;padding:28px 34px">
    <div style="display:flex;gap:16px;align-items:center"><span class="pill" style="background:rgba(96,84,236,.2);color:var(--indigo2)">Sentinel</span><span class="small" style="font-size:18px">rule: “check airdrops with Scout”</span></div>
    <div style="font-size:26px;margin-top:18px">Pinged you, and handed it to Scout.</div>
  </div>
  <div class="abs" id="m1-flow" style="left:680px;top:170px;width:1140px;height:560px">
    <svg class="abs" width="1140" height="560" style="left:0;top:0"><path id="m1-path" d="M115 80 H 560 H 1025 V 300 H 600 H 115 V 480 H 1025" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="3" stroke-dasharray="10 12"/></svg>
    <div class="node card" id="m1-n0" style="left:0;top:20px"><b>Scout</b><span>your remora</span></div>
    <div class="node card" id="m1-n1" style="left:445px;top:20px"><b>Reef</b><span>sui-risk · 0.01</span></div>

      const g = ctx.createGain(); const tt = c + (kind === 4 ? i * .06 : 0); const len = kind === 5 ? .32 : kind === 4 ? .5 : .18;

      const s = ctx.createBufferSource(); s.buffer = noise; const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 800 + ((k * 977) % 3000); f.Q.value = 6;

window.renderAudio = renderAudio;

// ───────────────────────────── boot ─────────────────────────────
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));

  if (q.has("t")) { render(Number(q.get("t"))); return true; }
  if (q.has("render")) { render(0); return true; }
  // Live playback, with the soundtrack if the browser allows it.
  let start = performance.now();
  const loop = () => { const t = ((performance.now() - start) / 1000) % DUR; render(t); requestAnimationFrame(loop); };
  document.addEventListener("click", async () => {
    const n = await renderAudio(44100); const ac = new AudioContext({ sampleRate: 44100 });
    const pcm = new Int16Array(window.__pcm.buffer); const b = ac.createBuffer(2, n / 4, 44100);
    const l = b.getChannelData(0), r = b.getChannelData(1); for (let i = 0; i < n / 4; i++) { l[i] = pcm[2 * i] / 32768; r[i] = pcm[2 * i + 1] / 32768; }
    const s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(); start = performance.now();
  }, { once: true });
  loop(); return true;
})();
